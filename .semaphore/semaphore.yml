# Hand-maintained (service.yml sets pipeline_enable: false). Build + test only;
# incrementals auto-publish via the release-internal-version promotion at the bottom.
version: v1.0
name: build-test-release
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

fail_fast:
  cancel:
    when: "true"

execution_time_limit:
  hours: 1

queue:
  - when: "branch !~ '[0-9]+\\.[0-9]+\\.[0-9]+\\.x'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version java 11
      - . cache-maven restore

blocks:
  - name: Test
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/.deployed-versions/', '/.github/', '/service.yml', '/README.md'], default_branch: 'master'})"
    task:
      jobs:
        - name: Test
          commands:
            - ci-sem-pint -c
            - mvn -U -Dmaven.wagon.http.retryHandler.count=10 --batch-mode --no-transfer-progress clean verify install dependency:analyze validate
            - cve-scan
            - . cache-maven store
      epilogue:
        always:
          commands:
            - . publish-test-results
            - artifact push workflow target/test-results
            - artifact push workflow target

after_pipeline:
  task:
    agent:
      machine:
        type: s1-prod-ubuntu24-04-arm64-00
    jobs:
      - name: Metrics
        commands:
          - emit-ci-metrics -p -a test-results
      - name: Publish Test Results
        commands:
          - test-results gen-pipeline-report
      - name: SonarQube
        commands:
          - checkout
          - artifact pull workflow target
          - emit-sonarqube-data --run_only_sonar_scan

# Each green release-branch (X.Y.Z.x) build auto-publishes the next 1.0.16-N + tag.
promotions:
  - name: Release internal version (1.0.16-N)
    pipeline_file: release-internal-version.yml
    auto_promote:
      when: "result = 'passed' and branch =~ '[0-9]+\\.[0-9]+\\.[0-9]+\\.x'"
