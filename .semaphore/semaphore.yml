# HAND-MAINTAINED (not ServiceBot-generated). service.yml sets
# `semaphore.pipeline_enable: false` so ServiceBot does NOT overwrite this file.
# Main pipeline = build + test only. Publishing an incremental 1.0.16-N is a
# deliberate MANUAL promotion -> .semaphore/release-internal-version.yml, aligned
# with kafka-connect-jdbc's internal-version flow: the version is computed from
# git tags, set via `ci-tools ci-update-version`, tagged via `ci-tools ci-push-tag`,
# and deployed to Confluent CodeArtifact maven-snapshots.
version: v1.0
name: build-test-release
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

fail_fast:
  cancel:
    when: "true"

execution_time_limit:
  hours: 1

queue:
  # Non-release branches run in parallel; release branches (X.Y.Z.x) queue serially.
  - when: "branch !~ '[0-9]+\\.[0-9]+\\.[0-9]+\\.x'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version java 11
      - . cache-maven restore

blocks:
  - name: Test
    dependencies: []
    run:
      # don't run the tests on non-functional changes...
      when: "change_in('/', {exclude: ['/.deployed-versions/', '/.github/', '/service.yml', '/README.md'], default_branch: 'master'})"
    task:
      jobs:
        - name: Test
          commands:
            - ci-sem-pint -c
            - mvn -U -Dmaven.wagon.http.retryHandler.count=10 --batch-mode --no-transfer-progress clean verify install dependency:analyze validate
            - cve-scan
            - . cache-maven store
      epilogue:
        always:
          commands:
            - . publish-test-results
            - artifact push workflow target/test-results
            - artifact push workflow target

after_pipeline:
  task:
    agent:
      machine:
        type: s1-prod-ubuntu24-04-arm64-00
    jobs:
      - name: Metrics
        commands:
          - emit-ci-metrics -p -a test-results
      - name: Publish Test Results
        commands:
          - test-results gen-pipeline-report
      - name: SonarQube
        commands:
          - checkout
          - artifact pull workflow target
          - emit-sonarqube-data --run_only_sonar_scan

# Publishing an incremental build (1.0.16-N) is a deliberate, manually-triggered
# promotion -- run it from a green release-branch (X.Y.Z.x) build once your change
# is verified. See .semaphore/release-internal-version.yml.
promotions:
  - name: Release internal version (1.0.16-N)
    pipeline_file: release-internal-version.yml
