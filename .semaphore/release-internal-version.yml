# Cuts the next incremental 1.0.16-N (from git tags), tags it, deploys to maven-releases.
# Auto-promoted from each green release-branch build. Aligned with kafka-connect-jdbc.
version: v1.0
name: Release Internal Version
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version java 11
      - . cache-maven restore

blocks:
  - name: Release
    dependencies: []
    run:
      when: "branch =~ '[0-9]+\\.[0-9]+\\.[0-9]+\\.x'"
    task:
      jobs:
        - name: Release
          commands:
            - git fetch --tags -q
            - |
              # next -N = (highest existing v<base>-N tag) + 1; base = branch minus '.x'
              BASE="${SEMAPHORE_GIT_BRANCH%.x}"
              LAST=$(git tag -l | grep -E "^v${BASE//./\\.}-[0-9]+$" | sed "s|^v${BASE}-||" | sort -n | tail -1)
              NEXT="${BASE}-$(( ${LAST:-0} + 1 ))"
              echo "Releasing ${NEXT}"
              ci-tools ci-update-version --version "${NEXT}"
            - ci-tools ci-push-tag
            - mvn -U -Dmaven.wagon.http.retryHandler.count=10 --batch-mode --no-transfer-progress -DaltDeploymentRepository=confluent-codeartifact-internal::default::https://confluent-519856050701.d.codeartifact.us-west-2.amazonaws.com/maven/maven-releases/ -DrepositoryId=confluent-codeartifact-internal clean deploy -DskipTests
