name: messaging-connectors-commons
lang: java
lang_version: "8"
git:
  enable: true
codeowners:
  enable: true
semaphore:
  enable: true
  pipeline_type: cp
  cve_scan: true
  # Confluent CI runs ONLY on our release branches (the `X.Y.Z.x` pattern, e.g.
  # 1.0.16.x). `master` is intentionally excluded: it mirrors upstream
  # 1.0.17-SNAPSHOT, and deploying a SNAPSHOT to maven-releases would fail.
  # Deploy is gated to these release branches + tags by the generated cp
  # pipeline; PR/feature branches get build+test only -- no deploy, no creds.
  branches:
    - /^\d+\.\d+\.\d+\.x$/
    - /^gh-readonly-queue.*/
# Confluent fork of datastax/messaging-connectors-commons. We republish the
# upstream artifacts (keeping the com.datastax.oss GAV) with a Debezium-style
# `-N` build suffix to Confluent CodeArtifact maven-releases (immutable releases).
code_artifact:
  enable: true
  package_paths:
    - maven-releases/maven/com.datastax.oss/messaging-connectors-commons-core
    - maven-releases/maven/com.datastax.oss/dsbulk-codecs-text-messaging-components-fork
    - maven-releases/maven/com.datastax.oss/messaging-connectors-commons-parent
