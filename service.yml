name: messaging-connectors-commons
lang: java
lang_version: "11"
git:
  enable: true
codeowners:
  enable: true
semaphore:
  enable: true
  pipeline_type: cp
  # We hand-maintain .semaphore/*.yml (ServiceBot still manages CODEOWNERS, code_artifact, etc.).
  pipeline_enable: false
  cve_scan: true
  # Build only release branches (X.Y.Z.x); master mirrors upstream and is excluded.
  branches:
    - /^\d+\.\d+\.\d+\.x$/
    - /^gh-readonly-queue.*/
# Incremental 1.0.16-N builds, published to CodeArtifact maven-snapshots.
code_artifact:
  enable: true
  package_paths:
    - maven-snapshots/maven/com.datastax.oss/messaging-connectors-commons-core
    - maven-snapshots/maven/com.datastax.oss/dsbulk-codecs-text-messaging-components-fork
    - maven-snapshots/maven/com.datastax.oss/messaging-connectors-commons-parent
